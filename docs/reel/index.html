<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f7f4ee;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="34"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-pile"
        class="scene"
        data-composition-id="01-pile"
        data-composition-src="compositions/frames/01-pile.html"
        data-start="0"
        data-duration="4.1"
        data-track-index="0"
      ></div>

      <div
        id="el-02-search"
        class="scene"
        data-composition-id="02-search"
        data-composition-src="compositions/frames/02-search.html"
        data-start="3.5"
        data-duration="7"
        data-track-index="1"
      ></div>

      <div
        id="el-03-people"
        class="scene"
        data-composition-id="03-people"
        data-composition-src="compositions/frames/03-people.html"
        data-start="10"
        data-duration="5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-video"
        class="scene"
        data-composition-id="04-video"
        data-composition-src="compositions/frames/04-video.html"
        data-start="14.5"
        data-duration="3.6"
        data-track-index="1"
      ></div>

      <div
        id="el-05-numbers"
        class="scene"
        data-composition-id="05-numbers"
        data-composition-src="compositions/frames/05-numbers.html"
        data-start="17.5"
        data-duration="6.5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-deliver"
        class="scene"
        data-composition-id="06-deliver"
        data-composition-src="compositions/frames/06-deliver.html"
        data-start="23.5"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-07-private"
        class="scene"
        data-composition-id="07-private"
        data-composition-src="compositions/frames/07-private.html"
        data-start="28"
        data-duration="3.1"
        data-track-index="0"
      ></div>

      <div
        id="el-08-end"
        class="scene"
        data-composition-id="08-end"
        data-composition-src="compositions/frames/08-end.html"
        data-start="30.5"
        data-duration="3.5"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-pile", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 3.5);
        tl.fromTo("#el-02-search", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 3.5);
        tl.to("#el-02-search", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 10);
        tl.fromTo("#el-03-people", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 10);
        tl.to("#el-03-people", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 14.5);
        tl.fromTo("#el-04-video", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 14.5);
        tl.to("#el-04-video", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 17.5);
        tl.fromTo("#el-05-numbers", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 17.5);
        tl.to("#el-05-numbers", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 23.5);
        tl.fromTo("#el-06-deliver", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 23.5);
        tl.to("#el-06-deliver", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 28);
        tl.fromTo("#el-07-private", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 28);
        tl.to("#el-07-private", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 30.5);
        tl.fromTo("#el-08-end", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 30.5);
        tl.to({}, { duration: 34 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
